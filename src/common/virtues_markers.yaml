# The 18-marker panel resolved onto UniProt accessions — VirTues' vocabulary.
#
# VirTues is marker-aware through *protein sequence*: every channel is embedded
# by ESM-2 from the canonical amino-acid sequence of its target, and that
# embedding is the only thing identifying the channel to the model. A channel
# therefore needs a UniProt accession to exist for VirTues at all; there is no
# name-matching fallback the way there is for KRONOS2 or DeepCell Types.
#
# `null` means the target is not a protein, so there is no sequence to embed.
# Those channels are dropped from the stack rather than given a stand-in
# accession, which would tell the model it is looking at a different molecule.
#
# Where spora's own channel table (the corpus VirTues was trained on —
# virtues/assets/example_dataset/imc/channels.parquet) already assigns an
# accession to the same antigen, that assignment is copied verbatim rather than
# re-derived. Those are the IDs the published weights were trained under, and
# matching them is the entire point of the harmonisation step. Two are worth
# spelling out because the antigen is not itself the gene product:
#
#   cd15 -> P22083 (FUT4)   CD15 is the Lewis-X carbohydrate epitope, not a
#                           protein. spora maps it to the fucosyltransferase
#                           that synthesises it, so we do too.
#   cytokeratin -> P02533   pan-cytokeratin antibodies bind many keratins;
#                   (KRT14) spora resolves its pan-CK channel to KRT14.
uniprot:
  dapi:        null    # DNA stain — spora leaves nuclear stains (Iridium,
                       # DAPI) unmapped for exactly this reason
  cd11b:       P11215  # ITGAM
  cd11c:       P20702  # ITGAX
  cd15:        P22083  # FUT4 — see note above
  cd163:       Q86VB7  # CD163
  cd20:        P11836  # MS4A1
  cd206:       P22897  # MRC1
  cd30:        P28908  # TNFRSF8
  cd31:        P16284  # PECAM1
  cd4:         P01730  # CD4
  cd56:        P13591  # NCAM1
  cd68:        P34810  # CD68
  cd7:         P09564  # CD7
  cd8:         P01732  # CD8A
  cytokeratin: P02533  # KRT14 — see note above
  foxp3:       Q9BZS1  # FOXP3
  mct:         Q15661  # TPSAB1, mast cell tryptase alpha/beta-1
  podoplanin:  Q86YL7  # PDPN
